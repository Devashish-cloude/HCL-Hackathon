services:
  postgres:
    image: postgres:16-alpine
    container_name: learnpath_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learnpath_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learnpath_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
